name: keyring
globals:
  KeyringBinding:
    any: true
  BINDING_HEADER_KEYRING:
    any: true
  BINDING_NAME_KEYRING_OPEN:
    any: true
  KeyringSettings:
    any: true
  SLASH_KEYRING1:
    any: true
